name = "my-qr-system"
main = "src/index.js"
compatibility_date = "2026-11-13"

workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
SUPABASE_URL = "https://uzsikhbkeophujpeuvjk.supabase.co"

[previews.vars]
SUPABASE_URL = "https://iwgtrlwnjjdkraiedgoz.supabase.co"

[observability]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "LOGIN_GUARD"
class_name = "LoginRateLimiter"

[[previews.durable_objects.bindings]]
name = "LOGIN_GUARD"
class_name = "LoginRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LoginRateLimiter"]
